# Use case 02 from pitch.html: a migration across many files.
#
# Genuinely parallel work — the one case where fan-out is not a fashion
# statement. One file, one owner: each node owns a disjoint package.
#
#   python geng.py plan examples/migration.toml

[settings]
default_agent = "dev"
max_parallel = 3          # your wallet's throttle, not the tool's max

[agents.dev]
argv = ["claude", "-p", "--permission-mode", "acceptEdits", "--output-format", "text"]

[agents.review]
argv = ["claude", "-p", "--allowedTools", "Read,Grep,Glob", "--output-format", "text"]

[agents.shell]
argv = ["{python}", "-c", "{prompt}"]

# --- wave 1: same prompt, disjoint blast radius -------------------------------

[nodes.api]
isolate = true
cwd = "packages/api"
timeout = 1800
prompt = """
Replace every `logger.log(...)` call with `ctx.log(...)`.
Update every callsite in THIS package only. Do not touch other packages.
"""

[nodes.web]
isolate = true
cwd = "packages/web"
timeout = 1800
prompt = """
Replace every `logger.log(...)` call with `ctx.log(...)`.
Update every callsite in THIS package only. Do not touch other packages.
"""

[nodes.cli]
isolate = true
cwd = "packages/cli"
timeout = 1800
prompt = """
Replace every `logger.log(...)` call with `ctx.log(...)`.
Update every callsite in THIS package only. Do not touch other packages.
"""

# --- wave 2: the barrier. Nothing proceeds until the repo compiles. -----------
# Not an agent. A build, whose exit code is the verdict.

[nodes.check]
needs = ["api", "web", "cli"]
agent = "shell"
gate = true
timeout = 900
prompt = "import subprocess,sys; sys.exit(subprocess.run(['pnpm','-r','typecheck']).returncode or subprocess.run(['pnpm','-r','test']).returncode)"

# --- wave 3: the sweep a busy single agent always forgets ---------------------

[nodes.audit]
needs = ["check"]
agent = "review"
out = "build/migration-audit.md"
prompt = """
Search the whole repo for surviving `logger.log` callsites.
List them as file:line, or write exactly NONE. Do not edit anything.
"""
